<style>
/* Yerleşim: telefon genişliğinde tek sütun, klasik bir masal kitabı. Parşömen sayfalar, altın varaklı kabartma
   başlıklar, kemerli resim pencereleri. Gün, gece ve alacakaranlık bölümleri sırayla akar. */
:root{
  --ink:#0d1a3b; --midnight2:#15275a; --sapphire:#2d4a94; --mist:#a9bde8;
  --paper:#f6ead3; --paper2:#ecd9b4; --navy:#26305c; --navy-soft:#5d5f86;
  --sienna:#a8501a; --marigold:#e0841a; --amber:#f5b744; --cream:#fbf1dc; --blue:#4a6bb8; --blue-soft:#a9bde8;
  --gold:linear-gradient(180deg,#fff0c0 0%,#f2c55a 45%,#c48a24 100%);
  --font-display:'Cormorant Garamond', Georgia, 'Times New Roman', serif;
  --font-body:'EB Garamond', Georgia, 'Times New Roman', serif;
  --font-hand:'Great Vibes', 'Segoe Script', 'Brush Script MT', cursive;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--ink);color:var(--cream);font:400 17px/1.6 var(--font-body);-webkit-text-size-adjust:100%}
::selection{background:var(--amber);color:var(--ink)}
button,input,select{font:inherit}

.book{max-width:520px;margin-inline:auto;position:relative;overflow:hidden;box-shadow:0 0 0 1px rgba(255,255,255,.05),0 30px 80px rgba(0,0,0,.55)}
.book:not(.go) .rise{animation-play-state:paused}
